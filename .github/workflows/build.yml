name: Build downloadable EW Academy website
on:
  push:
    branches: [feature/interactive-ew-academy, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate web application
        run: node scripts/build.cjs
      - name: Upload complete browser application
        uses: actions/upload-artifact@v4
        with:
          name: ew-academy-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 90
