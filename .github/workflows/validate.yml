name: Validate EW Academy
on:
  push:
    branches: [main, feature/interactive-ew-academy]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Validate static app and course content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js
      - name: Verify curriculum and question banks
        run: node tests/check.cjs
      - name: Check site files
        run: test -s index.html && test -s app.js && test -s workbook.md
